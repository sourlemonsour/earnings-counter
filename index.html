<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TIME is">
    <meta name="theme-color" content="#070a11">
    <title>TIME is</title>
    <link id="appleTouchIcon" rel="apple-touch-icon" href="">
    <link id="appManifest" rel="manifest" href="">
    <style>
        :root {
            --bg-color: #070a11;
            --card-bg: #111827;
            --surface: #1f2937;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%);
            --money-color: #fef08a;
            --gold-gradient: linear-gradient(to bottom, #ffffff 0%, #ffffff 33%, #fef08a 35%, #eab308 70%, #ca8a04 100%);
            --start-color: #10b981;
            --reset-color: #38bdf8;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #070a11 70%);
            color: var(--text-primary);
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: env(safe-area-inset-top, 12px) 12px env(safe-area-inset-bottom, 12px);
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 20px 18px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.08);
            position: relative;
            transition: max-width 0.25s ease, padding 0.25s ease;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        h1 {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .config-btn {
            background: var(--surface);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }

        .config-btn:active {
            transform: scale(0.95);
        }

        .main-layout {
            display: flex;
            flex-direction: column;
        }

        /* スワイプ表示エリア */
        .display-card {
            background: #030408;
            border-radius: 18px;
            padding: 16px 0 20px;
            text-align: center;
            margin-bottom: 16px;
            border: 1px solid rgba(250, 204, 21, 0.3);
            box-shadow: inset 0 2px 20px rgba(0, 0, 0, 0.9);
            position: relative;
            overflow: hidden;
            touch-action: pan-y;
            user-select: none;
            cursor: grab;
        }

        .display-card:active {
            cursor: grabbing;
        }

        .page-dots {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .page-dot {
            width: 7px;
            height: 7px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.22);
            transition: all 0.25s ease;
            cursor: pointer;
        }

        .page-dot.active {
            width: 20px;
            background: #eab308;
        }

        .swipe-track {
            display: flex;
            width: 200%;
            transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .swipe-track.dragging {
            transition: none;
        }

        .swipe-slide {
            width: 50%;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .money-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            letter-spacing: 1.5px;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .money-value,
        .clock-value {
            font-size: clamp(2.4rem, 10vw, 3.1rem);
            font-weight: 900;
            color: var(--money-color);
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-variant-numeric: tabular-nums;
            line-height: 1.15;
            margin-bottom: 10px;
            transition: transform 0.1s ease;
        }

        .money-value.bump {
            transform: scale(1.06);
        }

        .time-display,
        .clock-date {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.5px;
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background: #1e293b;
            border-radius: 999px;
            margin-top: 16px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: #eab308;
            transition: width 0.15s linear, background-color 1s ease-in-out;
        }

        .progress-bar.overtime {
            background-color: #ef4444;
            animation: slowPulse 3s infinite ease-in-out;
        }

        @keyframes slowPulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        .action-panel {
            display: flex;
            flex-direction: column;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button.action-btn {
            padding: 14px;
            border-radius: 14px;
            border: none;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, filter 0.2s;
        }

        button.action-btn:active {
            transform: scale(0.97);
        }

        .btn-start {
            background: var(--start-color);
            color: #052e16;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .btn-stop {
            background: var(--danger);
            color: white;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }

        .btn-reset {
            background: var(--reset-color);
            color: #062033;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }

        /* --- スマホ横向き（ランドスケープ）：画面幅いっぱいに表示＆ボタンは下 --- */
        @media (orientation: landscape) and (max-height: 540px) {
            body {
                padding: 4px max(8px, env(safe-area-inset-left)) 4px max(8px, env(safe-area-inset-right));
                align-items: stretch;
            }

            .container {
                max-width: 100%;
                width: 100%;
                min-height: calc(100dvh - 8px);
                padding: 8px 14px;
                border-radius: 16px;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
            }

            header {
                margin-bottom: 4px;
            }

            .main-layout {
                display: flex;
                flex-direction: column;
                flex: 1;
                justify-content: space-between;
                gap: 6px;
            }

            .display-card {
                flex: 1;
                margin-bottom: 0;
                padding: 8px 0 10px;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }

            .swipe-slide {
                padding: 0 24px;
            }

            .page-dots {
                margin-bottom: 4px;
            }

            .money-label {
                font-size: 0.72rem;
                margin-bottom: 2px;
            }

            .money-value {
                font-size: clamp(2.8rem, 11vh, 4.4rem);
                margin-bottom: 4px;
            }

            .clock-value {
                font-size: clamp(3.6rem, 22vh, 14vw);
                margin-bottom: 6px;
                letter-spacing: 0.02em;
            }

            .time-display,
            .clock-date {
                font-size: clamp(1rem, 3.6vh, 1.35rem);
            }

            .progress-container {
                margin-top: 10px;
                height: 9px;
            }

            .controls {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
                margin-bottom: 0;
            }
        }

        /* --- 設定モーダル画面 --- */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 10, 17, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 100;
            padding: 16px;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            width: 100%;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            max-height: 92dvh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-header h2 {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .close-modal-btn {
            background: var(--surface);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
            min-width: 0;
        }

        .input-group.full {
            grid-column: span 2;
        }

        .hourly-rate-box {
            grid-column: span 2;
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .hourly-rate-box span.rate-val {
            color: var(--accent);
            font-size: 1rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
        }

        label {
            font-size: 0.78rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        input[type="number"],
        input[type="time"],
        select {
            -webkit-appearance: none;
            appearance: none;
            display: block;
            width: 100%;
            min-width: 0;
            height: 42px;
            line-height: 24px;
            background-color: var(--surface);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 8px 12px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="time"]::-webkit-date-and-time-value {
            text-align: left;
            margin: 0;
        }

        select {
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239ca3af' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
            padding-right: 34px;
        }

        input:focus, select:focus {
            border-color: var(--accent);
        }

        .save-config-btn {
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            border: none;
            background: var(--accent-gradient);
            color: white;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .save-config-btn:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 TIME is</h1>
            <button type="button" class="config-btn" onclick="openSettings()">
                ⚙️ 設定
            </button>
        </header>
        
        <div class="main-layout">
            <div class="display-card" id="displayCard">
                <div class="page-dots">
                    <span class="page-dot active" id="dot0" onclick="goToSlide(0)"></span>
                    <span class="page-dot" id="dot1" onclick="goToSlide(1)"></span>
                </div>

                <div class="swipe-track" id="swipeTrack">
                    <!-- スライド1: 金額カウンター -->
                    <div class="swipe-slide">
                        <div class="money-label">CURRENT EARNINGS</div>
                        <div class="money-value" id="currentMoney">¥0</div>
                        <div class="time-display" id="currentTime">00:00:00 / 01:00:00</div>
                        <div class="progress-container">
                            <div class="progress-bar" id="progressBar"></div>
                        </div>
                    </div>

                    <!-- スライド2: 現在時刻デジタル時計 -->
                    <div class="swipe-slide">
                        <div class="money-label">CURRENT TIME</div>
                        <div class="clock-value" id="clockTime">00:00:00</div>
                        <div class="clock-date" id="clockDate">2026.11.18 WED</div>
                        <div class="progress-container">
                            <div class="progress-bar" id="clockProgressBar"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="action-panel">
                <div class="controls">
                    <button type="button" class="action-btn btn-start" id="startBtn" onclick="toggleTimer()">スタート</button>
                    <button type="button" class="action-btn btn-reset" onclick="resetTimer()">リセット</button>
                </div>
            </div>
        </div>

        <!-- 設定モーダル画面 -->
        <div class="modal-overlay" id="settingsModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>⚙️ アプリ設定</h2>
                    <button type="button" class="close-modal-btn" onclick="closeSettings()">✕</button>
                </div>

                <div class="settings-grid">
                    <div class="input-group full">
                        <label>効果音</label>
                        <select id="soundSelect" onchange="onSoundSelectChange()">
                            <option value="on">🔊 効果音 ON</option>
                            <option value="off">🔇 効果音 OFF</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>開始時刻</label>
                        <input type="time" id="startTimeInput" value="09:00" onchange="onStartTimeChange()">
                    </div>
                    <div class="input-group">
                        <label>終了時刻</label>
                        <input type="time" id="endTimeInput" value="10:00" onchange="onEndTimeChange()">
                    </div>
                    <div class="input-group">
                        <label>金額 (円)</label>
                        <input type="number" id="targetMoney" value="10000" min="100" step="100" oninput="updateDisplay()">
                    </div>
                    <div class="input-group">
                        <label>時間 (分)</label>
                        <input type="number" id="targetMinutes" value="60" min="1" step="1" oninput="onMinutesChange()">
                    </div>
                    <div class="hourly-rate-box">
                        <span>時給換算</span>
                        <span class="rate-val" id="hourlyRateDisplay">¥10,000 / 時間</span>
                    </div>
                    <div class="input-group full">
                        <label>目標到達後の挙動</label>
                        <select id="completionMode">
                            <option value="stop">目標到達でストップする</option>
                            <option value="continue">そのまま増え続ける（残業モード）</option>
                        </select>
                    </div>
                </div>

                <button type="button" class="save-config-btn" onclick="closeSettings()">保存して閉じる</button>
            </div>
        </div>
    </div>

    <!-- スリープ防止用の隠し動画要素 -->
    <video id="keepAwakeVideo" muted playsinline loop style="display:none; width:1px; height:1px;">
        <source src="data:video/mp4;base64,AAAAHGZ0eXBpc29tAAACAGlzb21pc28yYXZjMQAAAAhmcmVlAAAAM21kYXQAAADmCAAAEEAAAB5bWlkYQAAB6RkaXJlYwAAB6B0cmFjawAAB3R0aXRsAAAB1HNmcm1lAAAACnNraXAAACJzYXZjMQAAAAhmcmVlAAAAM21kYXQAAADmCAAAEEAAAB5bWlkYQAAB6RkaXJlYwAAB6B0cmFjawAAB3R0aXRsAAAB1HNmcm1lAAAACnNraXAAACJzYXZjMQAAAAhmcmVlAAAAM21kYXQAAADmCAAAEEAAAB5bWlkYQAAB6RkaXJlYwAAB6B0cmFjawAAB3R0aXRsAAAB1HNmcm1lAAAACnNraXAAACJzYXZjMQAAAAhmcmVlAAAAM21kYXQAAADmCAAAEEAAAB5bWlkYQAAB6RkaXJlYwAAB6B0cmFjawAAB3R0aXRsAAAB1HNmcm1lAAAACnNraXAAACJzYXZjMQAAAAhmcm
