<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TIME is">
    <meta name="theme-color" content="#070a11">
    <title>TIME is</title>
    <link id="appleTouchIcon" rel="apple-touch-icon" href="">
    <link id="appManifest" rel="manifest" href="">
    <style>
        :root {
            --bg-color: #070a11;
            --card-bg: #111827;
            --surface: #1f2937;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%);
            --money-color: #fef08a;
            --gold-gradient: linear-gradient(to bottom, #ffffff 0%, #ffffff 33%, #fef08a 35%, #eab308 70%, #ca8a04 100%);
            --num-font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            --start-color: #10b981;
            --reset-color: #38bdf8;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #070a11 70%);
            color: var(--text-primary);
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: env(safe-area-inset-top, 12px) 12px env(safe-area-inset-bottom, 12px);
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 20px 18px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.08);
            position: relative;
            transition: max-width 0.25s ease, padding 0.25s ease;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        h1 {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .config-btn {
            background: var(--surface);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }

        .config-btn:active {
            transform: scale(0.95);
        }

        .main-layout {
            display: flex;
            flex-direction: column;
        }

        /* スワイプ表示エリア */
        .display-card {
            background: #030408;
            border-radius: 18px;
            padding: 16px 0 20px;
            text-align: center;
            margin-bottom: 16px;
            border: 1px solid rgba(250, 204, 21, 0.3);
            box-shadow: inset 0 2px 20px rgba(0, 0, 0, 0.9);
            position: relative;
            overflow: hidden;
            touch-action: pan-y;
            user-select: none;
            cursor: grab;
        }

        .display-card:active {
            cursor: grabbing;
        }

        .page-dots {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .page-dot {
            width: 7px;
            height: 7px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.22);
            transition: all 0.25s ease;
            cursor: pointer;
        }

        .page-dot.active {
            width: 20px;
            background: #eab308;
        }

        .swipe-track {
            display: flex;
            width: 200%;
            transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .swipe-track.dragging {
            transition: none;
        }

        .swipe-slide {
            width: 50%;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .money-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            letter-spacing: 1.5px;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .money-value,
        .clock-value {
            font-size: clamp(2.4rem, 10vw, 3.1rem);
            font-weight: 900;
            color: var(--money-color);
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-variant-numeric: tabular-nums;
            line-height: 1.15;
            margin-bottom: 10px;
            transition: transform 0.1s ease;
        }

        .clock-value {
            font-family: var(--num-font);
        }

        .yen-symbol,
        .money-num {
            font-family: var(--num-font);
        }

        .yen-symbol {
            font-size: calc(1em * 2 / 3);
            vertical-align: baseline;
            margin-right: 2px;
        }

        .money-num {
            font-size: 1em;
        }

        .money-value.bump {
            transform: scale(1.06);
        }

        .time-display {
            color: var(--text-primary);
            font-size: 1.15rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.5px;
        }

        .clock-date {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.5px;
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background: #1e293b;
            border-radius: 999px;
            margin-top: 16px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: #eab308;
            transition: width 0.15s linear, background-color 1s ease-in-out;
        }

        .progress-bar.overtime {
            background-color: #ef4444;
            animation: slowPulse 3s infinite ease-in-out;
        }

        @keyframes slowPulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        .action-panel {
            display: flex;
            flex-direction: column;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button.action-btn {
            padding: 14px;
            border-radius: 14px;
            border: none;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, filter 0.2s;
        }

        button.action-btn:active {
            transform: scale(0.97);
        }

        .btn-start {
            background: var(--start-color);
            color: #052e16;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .btn-stop {
            background: var(--danger);
            color: white;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }

        .btn-reset {
            background: var(--reset-color);
            color: #062033;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }

        /* --- スマホ横向き（ランドスケープ）：画面幅いっぱいに表示＆ボタンは下 --- */
        @media (orientation: landscape) and (max-height: 540px) {
            body {
                padding: 4px max(8px, env(safe-area-inset-left)) 4px max(8px, env(safe-area-inset-right));
                align-items: stretch;
            }

            .container {
                max-width: 100%;
                width: 100%;
                min-height: calc(100dvh - 8px);
                padding: 8px 14px;
                border-radius: 16px;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
            }

            header {
                margin-bottom: 4px;
            }

            .main-layout {
                display: flex;
                flex-direction: column;
                flex: 1;
                justify-content: space-between;
                gap: 6px;
            }

            .display-card {
                flex: 1;
                margin-bottom: 0;
                padding: 8px 0 10px;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }

            .swipe-slide {
                padding: 0 24px;
            }

            .page-dots {
                margin-bottom: 4px;
            }

            .money-label {
                font-size: 0.72rem;
                margin-bottom: 2px;
            }

            /* 横画面では金額の数字部分を時計表示と同じサイズに拡大（¥はその2/3） */
            .money-value {
                margin-bottom: 6px;
                letter-spacing: 0.02em;
            }

            .money-value .money-num {
                font-size: clamp(3.6rem, 22vh, 14vw);
            }

            .money-value .yen-symbol {
                font-size: calc(clamp(3.6rem, 22vh, 14vw) * 2 / 3);
            }

            /* 時計表示の数字サイズ */
            .clock-value {
                font-size: clamp(3.6rem, 22vh, 14vw);
                margin-bottom: 6px;
                letter-spacing: 0.02em;
            }

            .time-display,
            .clock-date {
                font-size: clamp(1rem, 3.6vh, 1.35rem);
            }

            .progress-container {
                margin-top: 10px;
                height: 9px;
            }

            .controls {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
                margin-bottom: 0;
            }
        }

        /* --- 設定モーダル画面 --- */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 10, 17, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 100;
            padding: 16px;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            width: 100%;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            max-height: 92dvh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-header h2 {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .close-modal-btn {
            background: var(--surface);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
            min-width: 0;
        }

        .input-group.full {
            grid-column: span 2;
        }

        .hourly-rate-box {
            grid-column: span 2;
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .hourly-rate-box span.rate-val {
            color: var(--accent);
            font-size: 1rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
        }

        label {
            font-size: 0.78rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        input[type="number"],
        input[type="time"],
        select {
            -webkit-appearance: none;
            appearance: none;
            display: block;
            width: 100%;
            min-width: 0;
            height: 42px;
            line-height: 24px;
            background-color: var(--surface);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 8px 12px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="time"]::-webkit-date-and-time-value {
            text-align: left;
            margin: 0;
        }

        select {
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239ca3af' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
            padding-right: 34px;
        }

        input:focus, select:focus {
            border-color: var(--accent);
        }

        .save-config-btn {
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            border: none;
            background: var(--accent-gradient);
            color: white;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .save-config-btn:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 TIME is</h1>
            <button type="button" class="config-btn" onclick="openSettings()">
                ⚙️ 設定
            </button>
        </header>
        
        <div class="main-layout">
            <div class="display-card" id="displayCard">
                <div class="page-dots">
                    <span class="page-dot active" id="dot0" onclick="goToSlide(0)"></span>
                    <span class="page-dot" id="dot1" onclick="goToSlide(1)"></span>
                </div>

                <div class="swipe-track" id="swipeTrack">
                    <!-- スライド1: 金額カウンター -->
                    <div class="swipe-slide">
                        <div class="money-label">CURRENT EARNINGS</div>
                        <div class="money-value" id="currentMoney"><span class="yen-symbol">¥</span><span class="money-num">0</span></div>
                        <div class="time-display" id="currentTime">00:00:00 / 01:00:00</div>
                        <div class="progress-container">
                            <div class="progress-bar" id="progressBar"></div>
                        </div>
                    </div>

                    <!-- スライド2: 現在時刻デジタル時計 -->
                    <div class="swipe-slide">
                        <div class="money-label">CURRENT TIME</div>
                        <div class="clock-value" id="clockTime">00:00:00</div>
                        <div class="clock-date" id="clockDate">2026.11.18 WED</div>
                        <div class="progress-container">
                            <div class="progress-bar" id="clockProgressBar"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="action-panel">
                <div class="controls">
                    <button type="button" class="action-btn btn-start" id="startBtn" onclick="toggleTimer()">スタート</button>
                    <button type="button" class="action-btn btn-reset" onclick="resetTimer()">リセット</button>
                </div>
            </div>
        </div>

        <!-- 設定モーダル画面 -->
        <div class="modal-overlay" id="settingsModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>⚙️ アプリ設定</h2>
                    <button type="button" class="close-modal-btn" onclick="cancelSettings()">✕</button>
                </div>

                <div class="settings-grid">
                    <div class="input-group full">
                        <label>効果音</label>
                        <select id="soundSelect" onchange="onSoundSelectChange()">
                            <option value="on">🔊 効果音 ON</option>
                            <option value="off">🔇 効果音 OFF</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>フォント</label>
                        <select id="fontSelect" onchange="onAppearanceChange()">
                            <option value="default">デフォルト</option>
                            <option value="rounded">ラウンドポップ</option>
                            <option value="gothic">モダンゴシック</option>
                            <option value="mincho">クラシカル明朝</option>
                            <option value="mono">ネオレトロ等幅</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>カラー</label>
                        <select id="colorSelect" onchange="onAppearanceChange()">
                            <option value="default">デフォルト</option>
                            <option value="emerald">エメラルドグリーン</option>
                            <option value="cyan">サイバーシアン</option>
                            <option value="rose">ローズゴールド</option>
                            <option value="silver">プラチナシルバー</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>開始時刻</label>
                        <input type="time" id="startTimeInput" value="09:00" onchange="onStartTimeChange()">
                    </div>
                    <div class="input-group">
                        <label>終了時刻</label>
                        <input type="time" id="endTimeInput" value="10:00" onchange="onEndTimeChange()">
                    </div>
                    <div class="input-group">
                        <label>金額 (円)</label>
                        <input type="number" id="targetMoney" value="10000" min="100" step="100" oninput="updateDisplay()">
                    </div>
                    <div class="input-group">
                        <label>時間 (分)</label>
                        <input type="number" id="targetMinutes" value="60" min="1" step="1" oninput="onMinutesChange()">
                    </div>
                    <div class="hourly-rate-box">
                        <span>時給換算</span>
                        <span class="rate-val" id="hourlyRateDisplay">¥10,000 / 時間</span>
                    </div>
                    <div class="input-group full">
                        <label>目標到達後の挙動</label>
                        <select id="completionMode">
                            <option value="stop">目標到達でストップする</option>
                            <option value="continue">そのまま増え続ける（残業モード）</option>
                        </select>
                    </div>
                </div>

                <button type="button" class="save-config-btn" onclick="closeSettings()">保存して閉じる</button>
            </div>
        </div>
    </div>

    <!-- スリープ防止用の隠し動画要素 -->
    <video id="keepAwakeVideo" muted playsinline loop style="display:none; width:1px; height:1px;">
        <source src="data:video/mp4;base64,AAAAHGZ0eXBpc29tAAACAGlzb21pc28yYXZjMQAAAAhmcmVlAAAAM21kYXQAAADmCAAAEEAAAB5bWlkYQAAB6RkaXJlYwAAB6B0cmFjawAAB3R0aXRsAAAB1HNmcm1lAAAACnNraXAAACJzYXZjMQAAAAhmcmVlAAAAM21kYXQAAADmCAAAEEAAAB5bWlkYQAAB6RkaXJlYwAAB6B0cmFjawAAB3R0aXRsAAAB1HNmcm1lAAAACnNraXAAACJzYXZjMQAAAAhmcmVlAAAAM21kYXQAAADmCAAAEEAAAB5bWlkYQAAB6RkaXJlYwAAB6B0cmFjawAAB3R0aXRsAAAB1HNmcm1lAAAACnNraXAAACJzYXZjMQAAAAhmcmVlAAAAM21kYXQAAADmCAAAEEAAAB5bWlkYQAAB6RkaXJlYwAAB6B0cmFjawAAB3R0aXRsAAAB1HNmcm1lAAAACnNraXAAACJzYXZjMQAAAAhmcmVlAAAAM21kYXQAAADmCAAAEEAAAB5bWlkYQAAB6RkaXJlYwAAB6B0cmFjawAAB3R0aXRsAAAB1HNmcm1lAAAACnNraXAAACJzYXZjMQAAAAhmcmVlAAAAM21kYXQAAADmCAAAEEAAAB5bWlkYQAAB6RkaXJlYwAAB6B0cmFjawAAB3R0aXRsAAAB1HNmcm1lAAAACnNraXAAACJzYXZjMQAAAAhmcmVlAAAAM21kYXQAAADmCAAAEEAAAB5bWlkYQAAB6RkaXJlYwAAB6B0cmFjawAAB3R0aXRsAAAB1HNmcm1lAAAACnNraXAAACJzYXZjMQAAAAhmcmVlAAAAM21kYXQAAADmCAAAEEAAAB5bWlkYQAAB6RkaXJlYwAAB6B0cmFjawAAB3R0aXRsAAAB1HNmcm1lAAAACnNraXAAACJ=" type="video/mp4">
    </video>

    <script>
        const STORAGE_KEY = 'time_is_state_v1';

        const FONT_THEMES = {
            default: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif",
            rounded: "'Hiragino Maru Gothic ProN', 'Quicksand', 'Arial Rounded MT Bold', sans-serif",
            gothic: "'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif",
            mincho: "'Hiragino Mincho ProN', 'Yu Mincho', 'Times New Roman', Georgia, serif",
            mono: "'Helvetica Neue', 'Segoe UI', 'Hiragino Sans', 'Yu Gothic UI', sans-serif"
        };

        const COLOR_THEMES = {
            default: {
                moneyColor: '#fef08a',
                gradient: 'linear-gradient(to bottom, #ffffff 0%, #ffffff 33%, #fef08a 35%, #eab308 70%, #ca8a04 100%)'
            },
            emerald: {
                moneyColor: '#a7f3d0',
                gradient: 'linear-gradient(to bottom, #ffffff 0%, #ffffff 33%, #a7f3d0 35%, #10b981 70%, #047857 100%)'
            },
            cyan: {
                moneyColor: '#bae6fd',
                gradient: 'linear-gradient(to bottom, #ffffff 0%, #ffffff 33%, #bae6fd 35%, #38bdf8 70%, #0284c7 100%)'
            },
            rose: {
                moneyColor: '#fecdd3',
                gradient: 'linear-gradient(to bottom, #ffffff 0%, #ffffff 33%, #fecdd3 35%, #fb7185 70%, #e11d48 100%)'
            },
            silver: {
                moneyColor: '#e2e8f0',
                gradient: 'linear-gradient(to bottom, #ffffff 0%, #ffffff 33%, #f1f5f9 35%, #94a3b8 70%, #475569 100%)'
            }
        };

        function applyAppearance() {
            const fontKey = document.getElementById('fontSelect').value;
            const colorKey = document.getElementById('colorSelect').value;

            const fontStack = FONT_THEMES[fontKey] || FONT_THEMES.default;
            const palette = COLOR_THEMES[colorKey] || COLOR_THEMES.default;

            document.documentElement.style.setProperty('--num-font', fontStack);
            document.documentElement.style.setProperty('--money-color', palette.moneyColor);
            document.documentElement.style.setProperty('--gold-gradient', palette.gradient);
        }

        function onAppearanceChange() {
            applyAppearance();
        }

        // --- PWA & オフライン動作セットアップ ---
        (function setupOfflinePWA() {
            try {

        // --- Web Audio API（マリオコイン音・1UP音・ファンファーレ＋復帰強化） ---
        let audioCtx = null;
        let isSoundOn = true;
        let lastCoinPlayTime = 0;
        let wakeLock = null;

        function createFreshAudioContext() {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) return null;
            if (audioCtx && audioCtx.state !== 'closed') {
                try {
                    audioCtx.close().catch(() => {});
                } catch (e) {}
            }
            audioCtx = new AudioContextClass();
            return audioCtx;
        }

        function unlockAudioPipe(ctx) {
            if (!ctx) return;
            try {
                const buffer = ctx.createBuffer(1, 1, ctx.sampleRate || 22050);
                const src = ctx.createBufferSource();
                src.buffer = buffer;
                src.connect(ctx.destination);
                src.start(0);
            } catch (e) {}
        }

        function initAudio(forceRecreate = false) {
            if (forceRecreate || !audioCtx || audioCtx.state === 'closed') {
                createFreshAudioContext();
            }
            if (!audioCtx) return null;

            if (audioCtx.state === 'suspended' || audioCtx.state === 'interrupted') {
                try {
                    const p = audioCtx.resume();
                    if (p && typeof p.catch === 'function') p.catch(() => {});
                } catch (e) {}
            }
            return audioCtx;
        }

        function ensureAudioReady(forceRecreate = false) {
            const ctx = initAudio(forceRecreate);
            if (!ctx) return null;

            unlockAudioPipe(ctx);

            if (ctx.state !== 'running') {
                const fresh = createFreshAudioContext();
                if (fresh) {
                    try {
                        const p = fresh.resume();
                        if (p && typeof p.catch === 'function') p.catch(() => {});
                    } catch (e) {}
                    unlockAudioPipe(fresh);
                }
            }
            return audioCtx;
        }

        ['pointerdown', 'touchstart', 'click', 'keydown'].forEach((evName) => {
            document.addEventListener(evName, () => {
                if (!isSoundOn) return;
                if (!audioCtx || audioCtx.state !== 'running') {
                    ensureAudioReady(false);
                }
            }, { passive: true });
        });

        // --- スワイプ切り替え制御 ---
        let currentSlide = 0;
        let touchStartX = 0;
        let touchDeltaX = 0;
        let isDragging = false;

        const displayCard = document.getElementById('displayCard');
        const swipeTrack = document.getElementById('swipeTrack');

        function goToSlide(index) {
            currentSlide = Math.max(0, Math.min(1, index));
            swipeTrack.classList.remove('dragging');
            swipeTrack.style.transform = `translateX(-${currentSlide * 50}%)`;
            document.getElementById('dot0').classList.toggle('active', currentSlide === 0);
            document.getElementById('dot1').classList.toggle('active', currentSlide === 1);
        }

        function handleDragStart(clientX) {
            isDragging = true;
            touchStartX = clientX;
            touchDeltaX = 0;
            swipeTrack.classList.add('dragging');
        }

        function handleDragMove(clientX) {
            if (!isDragging) return;
            touchDeltaX = clientX - touchStartX;
            const cardWidth = displayCard.offsetWidth || 300;
            const basePercent = -currentSlide * 50;
            const deltaPercent = (touchDeltaX / cardWidth) * 50;
            const clampedPercent = Math.max(-55, Math.min(5, basePercent + deltaPercent));
            swipeTrack.style.transform = `translateX(${clampedPercent}%)`;
        }

        function handleDragEnd() {
            if (!isDragging) return;
            isDragging = false;
            const threshold = 45;
            if (touchDeltaX < -threshold && currentSlide === 0) {
                goToSlide(1);
            } else if (touchDeltaX > threshold && currentSlide === 1) {
                goToSlide(0);
            } else {
                goToSlide(currentSlide);
            }
        }

        displayCard.addEventListener('touchstart', (e) => handleDragStart(e.touches[0].clientX), { passive: true });
        displayCard.addEventListener('touchmove', (e) => handleDragMove(e.touches[0].clientX), { passive: true });
        displayCard.addEventListener('touchend', handleDragEnd);

        displayCard.addEventListener('mousedown', (e) => handleDragStart(e.clientX));
        window.addEventListener('mousemove', (e) => handleDragMove(e.clientX));
        window.addEventListener('mouseup', handleDragEnd);

        // --- 時計更新処理 ---
        const weekDays = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
        function updateClock() {
            const now = new Date();
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');

            const yyyy = now.getFullYear();
            const mo = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const day = weekDays[now.getDay()];
            document.getElementById('clockDate').innerText = `${yyyy}.${mo}.${dd} ${day}`;

        function playCoinSound(isFastForward = false) {
            if (!isSoundOn || currentSlide === 1) return;
            const ctx = (!audioCtx || audioCtx.state !== 'running') ? ensureAudioReady(false) : audioCtx;
            if (!ctx) return;

            const nowMs = performance.now();
            if (isFastForward && nowMs - lastCoinPlayTime < 70) return;
            lastCoinPlayTime = nowMs;

            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            
            osc.type = 'square';
            osc.frequency.setValueAtTime(987.77, now);
            osc.frequency.setValueAtTime(1318.51, now + 0.055);
            
            const volume = isFastForward ? 0.06 : 0.11;
            const duration = isFastForward ? 0.18 : 0.35;

            gain.gain.setValueAtTime(volume, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
            
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            osc.start(now);
            osc.stop(now + duration);
        }

        function play1UpSound() {
            if (!isSoundOn || currentSlide === 1) return;
            const ctx = (!audioCtx || audioCtx.state !== 'running') ? ensureAudioReady(false) : audioCtx;
            if (!ctx) return;

            const now = ctx.currentTime;
            const notes = [1318.51, 1567.98, 2637.02, 2093.00, 2349.32, 3135.96];
            const step = 0.085;

            notes.forEach((freq, idx) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'square';
                const startTime = now + idx * step;
                const duration = (idx === notes.length - 1) ? 0.28 : step;

                osc.frequency.setValueAtTime(freq, startTime);
                gain.gain.setValueAtTime(0.18, startTime);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start(startTime);
                osc.stop(startTime + duration);
            });
        }

        function playFanfare() {
            if (!isSoundOn || currentSlide === 1) return;
            const ctx = (!audioCtx || audioCtx.state !== 'running') ? ensureAudioReady(false) : audioCtx;
            if (!ctx) return;

            const now = ctx.currentTime;
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now + i * 0.11);
                gain.gain.setValueAtTime(0.2, now + i * 0.11);
                gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.11 + 0.35);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now + i * 0.11);
                osc.stop(now + i * 0.11 + 0.35);
            });
        }

        let timerId = null;
        let displayedSeconds = 0;
        let timerStartWallTime = null;
        let isRunning = false;

        let isStartTimeManuallySet = false;

            stopTimer();

        function saveAppState() {
            if (wasReset) return;
            try {
                const state = {
                    isRunning,
                    isPaused,
                    timerStartWallTime,
                    displayedSeconds,
                    isStartTimeManuallySet,
                    wasReset: false,
                    lastDisplayedMoney,
                    last1000Milestone,
                    fanfarePlayed,
                    soundSelect: document.getElementById('soundSelect').value,
                    fontSelect: document.getElementById('fontSelect').value,
                    colorSelect: document.getElementById('colorSelect').value,
                    startTimeInput: document.getElementById('startTimeInput').value,
                    endTimeInput: document.getElementById('endTimeInput').value,
                    targetMoney: document.getElementById('targetMoney').value,
                    targetMinutes: document.getElementById('targetMinutes').value,
                    completionMode: document.getElementById('completionMode').value
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {}
        }

        function loadAppState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return false;
                const s = JSON.parse(raw);

                if (s.wasReset) {
                    localStorage.removeItem(STORAGE_KEY);
                    applyInitialDefaults();
                    return true;
                }

                if (s.soundSelect) {
                    document.getElementById('soundSelect').value = s.soundSelect;
                    isSoundOn = (s.soundSelect === 'on');
                }
                if (s.fontSelect && FONT_THEMES[s.fontSelect]) {
                    document.getElementById('fontSelect').value = s.fontSelect;
                }
                if (s.colorSelect && COLOR_THEMES[s.colorSelect]) {
                    document.getElementById('colorSelect').value = s.colorSelect;
                }
                if (s.startTimeInput) document.getElementById('startTimeInput').value = s.startTimeInput;
                if (s.endTimeInput) document.getElementById('endTimeInput').value = s.endTimeInput;
                if (s.targetMoney) document.getElementById('targetMoney').value = s.targetMoney;
                if (s.targetMinutes) document.getElementById('targetMinutes').value = s.targetMinutes;
                if (s.completionMode) document.getElementById('completionMode').value = s.completionMode;

                applyAppearance();

                isStartTimeManuallySet = Boolean(s.isStartTimeManuallySet);
                lastDisplayedMoney = Number(s.lastDisplayedMoney) || 0;
                last1000Milestone = Number(s.last1000Milestone) || 0;
                fanfarePlayed = Boolean(s.fanfarePlayed);

                if (s.isRunning && s.timerStartWallTime) {
                    isRunning = true;
                    isPaused = Boolean(s.isPaused);
                    timerStartWallTime = Number(s.timerStartWallTime);

                    const realElapsedSec = Math.max(0, Math.floor((Date.now() - timerStartWallTime) / 1000));
                    displayedSeconds = isPaused ? (Number(s.displayedSeconds) || 0) : realElapsedSec;

                    const startBtn = document.getElementById('startBtn');
                    if (isPaused) {
                        startBtn.innerText = '再開';
                        startBtn.className = 'action-btn btn-start';
                    } else {
                        startBtn.innerText = '一時停止';
                        startBtn.className = 'action-btn btn-stop';
                    }

                    document.getElementById('targetMoney').disabled = true;
                    document.getElementById('targetMinutes').disabled = true;
                    document.getElementById('startTimeInput').disabled = true;
                    document.getElementById('endTimeInput').disabled = true;

                    updateDisplay();
                    clearInterval(timerId);
                    timerId = setInterval(tick, 60);
                    return true;
                } else if ((Number(s.displayedSeconds) || 0) > 0) {
                    displayedSeconds = Number(s.displayedSeconds) || 0;
                    updateDisplay();
                    return true;
                }
            } catch (e) {}
            return false;
        }

        function formatTime(totalSeconds) {
            const safeSec = Math.max(0, Math.floor(totalSeconds));
            const h = Math.floor(safeSec / 3600);
            const m = Math.floor((safeSec % 3600) / 60);
            const s = safeSec % 60;
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function formatHHMM(date) {
            const hh = String(date.getHours()).padStart(2, '0');
            const mm = String(date.getMinutes()).padStart(2, '0');
            return `${hh}:${mm}`;
        }

        function getTargets() {
            const money = parseFloat(document.getElementById('targetMoney').value) || 0;
            const mins = parseFloat(document.getElementById('targetMinutes').value) || 0;
            return { targetMoney: money, targetSeconds: mins * 60 };
        }

        function onMinutesChange() {
            const startVal = document.getElementById('startTimeInput').value;
            const mins = parseInt(document.getElementById('targetMinutes').value, 10) || 0;
            if (startVal && mins > 0) {
                const [sh, sm] = startVal.split(':').map(Number);
                const d = new Date(2000, 0, 1, sh, sm + mins);
                document.getElementById('endTimeInput').value = formatHHMM(d);
            }
            updateDisplay();
        }

        function onStartTimeChange() {
            isStartTimeManuallySet = true;
            onMinutesChange();
        }

        function onEndTimeChange() {
            const startVal = document.getElementById('startTimeInput').value;
            const endVal = document.getElementById('endTimeInput').value;
            if (startVal && endVal) {
                const [sh, sm] = startVal.split(':').map(Number);
                const [eh, em] = endVal.split(':').map(Number);
                let diffMins = (eh * 60 + em) - (sh * 60 + sm);
                if (diffMins <= 0) {
                    diffMins += 24 * 60;
                }
                document.getElementById('targetMinutes').value = diffMins;
            }
            updateDisplay();
        }

        function updateDisplay() {
            const { targetMoney, targetSeconds } = getTargets();
            const currentMoney = targetSeconds > 0 ? (targetMoney / targetSeconds) * displayedSeconds : 0;
            const flooredMoney = Math.floor(currentMoney);

            setMoneyDisplay(flooredMoney);
            
            const timeStr = formatTime(displayedSeconds);
            const targetTimeStr = formatTime(Math.round(targetSeconds));
            document.getElementById('currentTime').innerText = `${timeStr} / ${targetTimeStr}`;

            const hourlyRate = targetSeconds > 0 ? Math.round((targetMoney / targetSeconds) * 3600) : 0;
            document.getElementById('hourlyRateDisplay').innerText = `¥${hourlyRate.toLocaleString()} / 時間`;

            const progress = targetSeconds > 0 ? Math.min((displayedSeconds / targetSeconds) * 100, 100) : 0;
            
            const progressBar = document.getElementById('progressBar');
            const clockProgressBar = document.getElementById('clockProgressBar');
            
            progressBar.style.width = progress + '%';
            clockProgressBar.style.width = progress + '%';

            if (targetSeconds > 0 && displayedSeconds >= targetSeconds) {
                progressBar.classList.add('overtime');
                clockProgressBar.classList.add('overtime');
            } else {
                progressBar.classList.remove('overtime');
                clockProgressBar.classList.remove('overtime');
            }

            return flooredMoney;
        }

        function triggerMoneyBump() {
            const el = document.getElementById('currentMoney');
            el.classList.add('bump');
            setTimeout(() => el.classList.remove('bump'), 160);
        }

        function toggleTimer() {
            if (!isRunning) {
                startTimer();
            } else if (isPaused) {
                resumeTimer();
            } else {
                pauseTimer();
            }
        }

        function startTimer() {
            ensureAudioReady(false);
            requestWakeLock();

            let baseOffsetMs = 0;

            if (!isStartTimeManuallySet) {
                const now = new Date();
                document.getElementById('startTimeInput').value = formatHHMM(now);
                onMinutesChange();
                baseOffsetMs = 0;
            } else {
                const timeVal = document.getElementById('startTimeInput').value;
                if (timeVal) {
                    const [sh, sm] = timeVal.split(':').map(Number);
                    const now = new Date();
                    const startD = new Date(now.getFullYear(), now.getMonth(), now.getDate(), sh, sm, 0);
                    baseOffsetMs = now.getTime() - startD.getTime();
                }
            }

            wasReset = false;
            isRunning = true;
            isPaused = false;
            timerStartWallTime = Date.now() - baseOffsetMs;
            displayedSeconds = Math.max(0, Math.floor(baseOffsetMs / 1000));
            
            const initialAmount = updateDisplay();
            lastDisplayedMoney = initialAmount;
            last1000Milestone = Math.floor(initialAmount / 1000);

            const startBtn = document.getElementById('startBtn');
            startBtn.innerText = '一時停止';
            startBtn.className = 'action-btn btn-stop';
            
            document.getElementById('targetMoney').disabled = true;
            document.getElementById('targetMinutes').disabled = true;
            document.getElementById('startTimeInput').disabled = true;
            document.getElementById('endTimeInput').disabled = true;

        function resumeTimer() {
            if (!isRunning || !isPaused) return;
            ensureAudioReady(true);
            requestWakeLock();
            isPaused = false;
            lastCoinPlayTime = 0;

            const startBtn = document.getElementById('startBtn');
            startBtn.innerText = '一時停止';
            startBtn.className = 'action-btn btn-stop';

        function stopTimer() {
            isRunning = false;
            isPaused = false;
            clearInterval(timerId);
            releaseWakeLock();

            const startBtn = document.getElementById('startBtn');
            startBtn.innerText = 'スタート';
            startBtn.className = 'action-btn btn-start';
            
            document.getElementById('targetMoney').disabled = false;
            document.getElementById('targetMinutes').disabled = false;
            document.getElementById('startTimeInput').disabled = false;
            document.getElementById('endTimeInput').disabled = false;

            document.getElementById('progressBar').classList.remove('overtime');
            document.getElementById('clockProgressBar').classList.remove('overtime');
            if (!wasReset) saveAppState();
        }

        function tick() {
            if (!isRunning) return;

            const realElapsedMs = Date.now() - timerStartWallTime;
            const { targetSeconds } = getTargets();
            const mode = document.getElementById('completionMode').value;

            let targetRealSeconds = Math.floor(realElapsedMs / 1000);
            if (mode === 'stop' && targetSeconds > 0 && targetRealSeconds >= targetSeconds) {
                targetRealSeconds = Math.round(targetSeconds);
            }

            if (isPaused) {
                let tempDisplayed = Math.min(targetRealSeconds, Math.max(0, Math.floor(realElapsedMs / 1000)));
                const progress = targetSeconds > 0 ? Math.min((tempDisplayed / targetSeconds) * 100, 100) : 0;
                
                const pBar = document.getElementById('progressBar');
                const cBar = document.getElementById('clockProgressBar');
                pBar.style.width = progress + '%';
                cBar.style.width = progress + '%';

                if (targetSeconds > 0 && tempDisplayed >= targetSeconds) {
                    pBar.classList.add('overtime');
                    cBar.classList.add('overtime');
                } else {
                    pBar.classList.remove('overtime');
                    cBar.classList.remove('overtime');
                }
                return;
            }

            let isFastForwarding = false;
            if (displayedSeconds < targetRealSeconds) {
                const gap = targetRealSeconds - displayedSeconds;
                if (gap > 1) {
                    isFastForwarding = true;
                    const step = Math.max(1, Math.ceil(gap / 15));
                    displayedSeconds = Math.min(targetRealSeconds, displayedSeconds + step);
                } else {
                    displayedSeconds = targetRealSeconds;
                }
            } else {
                return;
            }

            const currentAmount = updateDisplay();
            const moneyIncreased = currentAmount > lastDisplayedMoney;
            lastDisplayedMoney = currentAmount;

            const currentMilestone = Math.floor(currentAmount / 1000);
            const hit1000 = currentMilestone > last1000Milestone;
            if (hit1000) {
                last1000Milestone = currentMilestone;
                triggerMoneyBump();
            }

            if (displayedSeconds >= targetSeconds && targetSeconds > 0) {
                if (mode === 'stop') {
                    playFanfare();
                    stopTimer();
                    saveAppState();
                    return;
                } else {
                    if (!fanfarePlayed) {
                        fanfarePlayed = true;
                        playFanfare();
                    } else if (hit1000) {
                        play1UpSound();
                    } else if (moneyIncreased) {
                        playCoinSound(isFastForwarding);
                    }
                    saveAppState();
                    return;
                }
            }

            if (hit1000) {
                play1UpSound();
            } else if (moneyIncreased) {
                playCoinSound(isFastForwarding);
            }

            saveAppState();
        }

        function resetTimer() {
            stopTimer();
            displayedSeconds = 0;
            timerStartWallTime = null;
            lastDisplayedMoney = 0;
            last1000Milestone = 0;
            fanfarePlayed = false;
            isStartTimeManuallySet = false;
            wasReset = true;

            const now = new Date();
            document.getElementById('startTimeInput').value = formatHHMM(now);
            onMinutesChange();
            updateDisplay();

            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ wasReset: true }));
            } catch (e) {}
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                saveAppState();
            } else if (isRunning) {
                ensureAudioReady(false);
                requestWakeLock();
                tick();
            }
        });

        window.addEventListener('pagehide', saveAppState);

        if (!loadAppState()) {
            applyInitialDefaults();
        }
    </script>
</body>
</html>
